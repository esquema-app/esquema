# Publica una versión de Esquema sola: basta con subir el número de versión en app/Info.plist y escritorio/package.json (iguales:
# pruebas/contrato.py lo revisa) y hacer push a main. Compila Mac, Windows y Linux, arma cada descarga con su huella SHA-256 y crea
# el Release vX.Y.Z con nombres fijos (los usan instalar.sh, instalar.ps1 y el actualizador de cada app):
#   Esquema-macOS.zip, Esquema-Windows.exe, Esquema-Linux.AppImage, Esquema-Linux.tar.gz, Esquema-Linux.deb (+ .sha256 de cada uno).
# Si la versión ya existe, no hace nada.
name: Publicar versión
on:
  push:
    branches: [main]
    paths: ["app/Info.plist", "escritorio/package.json"]
    tags: ["v*"]
  workflow_dispatch:
concurrency:
  group: publicar
  cancel-in-progress: false
# Permisos mínimos: todo lee; solo el último paso (crear el Release) puede escribir.
permissions:
  contents: read
jobs:
  version:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.v.outputs.version }}
      publicar: ${{ steps.v.outputs.publicar }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 22 }
      - name: Pruebas rápidas (no se publica una versión rota)
        run: python3 pruebas/contrato.py && python3 pruebas/test_python.py && node pruebas/motor.mjs > /dev/null
      - id: v
        env: { GH_TOKEN: "${{ github.token }}", REF: "${{ github.ref }}", REF_NOMBRE: "${{ github.ref_name }}" }
        run: |
          if [[ "$REF" == refs/tags/v* ]]; then V="${REF_NOMBRE#v}"
          else V=$(python3 -c "import plistlib;print(plistlib.load(open('app/Info.plist','rb'))['CFBundleShortVersionString'])"); fi
          [[ "$V" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Versión inválida: $V"; exit 1; }
          echo "version=$V" >> "$GITHUB_OUTPUT"
          if gh release view "v$V" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "publicar=false" >> "$GITHUB_OUTPUT"; echo "v$V ya está publicada: nada que hacer."
          else echo "publicar=true" >> "$GITHUB_OUTPUT"; echo "Se publicará v$V"; fi

  macos:
    needs: version
    if: needs.version.outputs.publicar == 'true'
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - name: Versión en Info.plist
        env: { VERSION: "${{ needs.version.outputs.version }}" }
        run: /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $VERSION" app/Info.plist
      - name: Empaquetar
        run: bash herramientas/empaquetar.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with: { name: macos, path: "dist/Esquema-macOS.zip*" }

  windows-linux:
    needs: version
    if: needs.version.outputs.publicar == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    defaults: { run: { working-directory: escritorio } }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 22 }
      - name: Herramientas
        run: sudo apt-get update && sudo apt-get install -y nsis xvfb
      - name: Versión
        env: { VERSION: "${{ needs.version.outputs.version }}" }
        run: npm version --no-git-tag-version --allow-same-version "$VERSION"
      # Exactamente lo del package-lock.json y sin scripts de instalación (.npmrc: ignore-scripts).
      - run: npm ci && npm audit --audit-level=high
      - name: Linux (AppImage, tar.gz y deb)
        run: |
          bash herramientas/preparar.sh linux
          npx electron-builder --linux AppImage tar.gz deb
          (cd dist && for f in Esquema-Linux.AppImage Esquema-Linux.tar.gz Esquema-Linux.deb; do sha256sum "$f" > "$f.sha256"; done)
      - name: La app de Linux empaquetada abre (pantalla virtual)
        run: |
          npm i --no-save --ignore-scripts --prefix "$RUNNER_TEMP/pw" playwright@1.56.1
          NODE_PATH="$RUNNER_TEMP/pw/node_modules" ELECTRON=dist/linux-unpacked/esquema APP=1 SOLO_ARRANQUE=1 xvfb-run -a node pruebas/arranque.mjs
      - name: Windows (instalador)
        run: |
          bash herramientas/preparar.sh windows
          npx electron-builder --win dir
          bash herramientas/instalador-windows.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: escritorio
          path: |
            escritorio/dist/Esquema-Windows.exe*
            escritorio/dist/Esquema-Linux.*

  release:
    needs: [version, macos, windows-linux]
    permissions:
      contents: write
    if: needs.macos.result == 'success' && needs.windows-linux.result == 'success'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: { path: descargas, merge-multiple: true }
      - name: Crear el Release
        env: { GH_TOKEN: "${{ github.token }}", VERSION: "${{ needs.version.outputs.version }}", REPO: "${{ github.repository }}", SHA: "${{ github.sha }}" }
        run: |
          V="v$VERSION"
          ls -la descargas
          for f in Esquema-macOS.zip Esquema-Windows.exe Esquema-Linux.AppImage Esquema-Linux.tar.gz Esquema-Linux.deb; do
            [ -f "descargas/$f" ] && [ -f "descargas/$f.sha256" ] || { echo "Falta $f o su huella"; exit 1; }
          done
          gh release create "$V" descargas/* --repo "$REPO" --target "$SHA" --title "Esquema $V" --generate-notes
